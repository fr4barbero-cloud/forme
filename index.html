<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>FORME</title>
<style>
body { font-family: Arial, sans-serif; padding:20px; background:#f7f7f7; }
h1 { text-align:center; font-size:32px; }
table { width:100%; border-collapse:collapse; background:white; }
th, td { border:3px solid #000; padding:16px; text-align:center; vertical-align:middle; }
th { background:#eeeeee; font-size:22px; }
.forma-box { display:flex; flex-direction:column; align-items:center; gap:8px; font-weight:bold; }
svg { width:130px; height:110px; }
.nota button {
  font-size:40px;
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:#e6f7ff;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>FORME</h1>

<table>
<tr>
  <th>FORMA</th>
  <th>SUONO</th>
</tr>

<tr>
<td><div class="forma-box">TRIANGOLO
<svg viewBox="0 0 130 110">
<polygon points="65,10 115,100 15,100" stroke="black" fill="none" stroke-width="6"/>
</svg>
</div></td>
<td class="nota"><button onclick="suona('s1')">♪</button><audio id="s1" src="triangolo.mp3" preload="auto"></audio></td>
</tr>

<tr>
<td><div class="forma-box">CERCHIO
<svg viewBox="0 0 130 110">
<circle cx="65" cy="55" r="38" stroke="black" fill="none" stroke-width="6"/>
</svg>
</div></td>
<td class="nota"><button onclick="suona('s2')">♪</button><audio id="s2" src="cerchio.mp3" preload="auto"></audio></td>
</tr>

<tr>
<td><div class="forma-box">RAGGI
<svg viewBox="0 0 130 110">
<line x1="65" y1="5" x2="65" y2="105" stroke="black" stroke-width="5"/>
<line x1="15" y1="55" x2="115" y2="55" stroke="black" stroke-width="5"/>
<line x1="25" y1="15" x2="105" y2="95" stroke="black" stroke-width="5"/>
<line x1="105" y1="15" x2="25" y2="95" stroke="black" stroke-width="5"/>
</svg>
</div></td>
<td class="nota"><button onclick="suona('s3')">♪</button><audio id="s3" src="raggi.mp3" preload="auto"></audio></td>
</tr>

<tr>
<td><div class="forma-box">LINEA A ZIG ZAG
<svg viewBox="0 0 130 110">
<polyline points="10,95 35,15 60,95 85,15 120,95" stroke="black" fill="none" stroke-width="6"/>
</svg>
</div></td>
<td class="nota"><button onclick="suona('s4')">♪</button><audio id="s4" src="linea-frastagliata.mp3" preload="auto"></audio></td>
</tr>

<tr>
<td><div class="forma-box">LINEA ONDULATA
<svg viewBox="0 0 130 110">
<path d="M10 60 Q35 5 65 60 T120 60" stroke="black" fill="none" stroke-width="6"/>
</svg>
</div></td>
<td class="nota"><button onclick="suona('s5')">♪</button><audio id="s5" src="linea-ondulata.mp3" preload="auto"></audio></td>
</tr>

<tr>
<td><div class="forma-box">LINEA SPEZZATA
<svg viewBox="0 0 130 110">
<polyline points="15,80 45,55 35,20 85,48 88,12 120,12" 
stroke="black" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="miter"/>
</svg>
</div></td>
<td class="nota"><button onclick="suona('s6')">♪</button><audio id="s6" src="linea-spezzata.mp3" preload="auto"></audio></td>
</tr>

<tr>
<td><div class="forma-box">LINEA AGGROVIGLIATA
<svg viewBox="0 0 130 110">
<path d="M5 55
C25 55, 30 20, 65 55
C95 85, 120 55, 100 35
C80 15, 45 25, 45 55
C45 88, 95 88, 95 55
C95 20, 45 15, 25 45
C10 70, 45 80, 65 55
C85 30, 105 55, 125 55"
stroke="black" fill="none" stroke-width="5" stroke-linecap="round"/>
</svg>
</div></td>
<td class="nota"><button onclick="suona('s7')">♪</button><audio id="s7" src="linea-aggrovigliata.mp3" preload="auto"></audio></td>
</tr>

<tr>
<td><div class="forma-box">LINEA A SPIRALE
<svg viewBox="0 0 130 130">
<path d="M118 60
C118 30 95 8 66 8
C34 8 10 32 10 64
C10 98 36 122 70 122
C101 122 123 99 123 68
C123 39 101 18 72 18
C45 18 24 39 24 66
C24 92 44 111 70 111
C95 111 112 93 112 69
C112 46 94 30 72 30
C52 30 36 45 36 66
C36 85 50 99 69 99
C87 99 100 86 100 69
C100 53 88 42 72 42
C58 42 48 52 48 66
C48 79 57 88 70 88
C82 88 90 80 90 69
C90 60 82 53 73 53
C65 53 59 59 59 67
C59 74 64 79 71 79
C77 79 81 75 81 69"
stroke="black" fill="none" stroke-width="5" stroke-linecap="round"/>
</svg>
</div></td>
<td class="nota"><button onclick="suona('s8')">♪</button><audio id="s8" src="linea-spirale.mp3" preload="auto"></audio></td>
</tr>

</table>

<script>
function suona(id){
  const audio = document.getElementById(id);
  audio.pause();
  audio.currentTime = 0;
  audio.play();
}
</script>

</body>
</html>
