<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>FORME</title>
<style>
body { font-family: Arial, sans-serif; padding:20px; background:#f7f7f7; }
h1 { text-align:center; font-size:32px; }
table { width:100%; border-collapse:collapse; background:white; }
th, td { border:3px solid #000; padding:16px; text-align:center; vertical-align:middle; }
th { background:#eeeeee; font-size:22px; }
.forma-box { display:flex; flex-direction:column; align-items:center; gap:8px; font-weight:bold; }
svg { width:130px; height:110px; }
button { font-size:40px; padding:10px 20px; }
</style>
</head>
<body>

<h1>FORME</h1>

<table>
<tr><th>FORMA</th><th>SUONO</th></tr>

<tr>
<td>TRIANGOLO</td>
<td><button onclick="suona('s1')">♪</button><audio id="s1" src="triangolo(1).mp3"></audio></td>
</tr>

<tr>
<td>CERCHIO</td>
<td><button onclick="suona('s2')">♪</button><audio id="s2" src="cerchio(1).mp3"></audio></td>
</tr>

<tr>
<td>RAGGI</td>
<td><button onclick="suona('s3')">♪</button><audio id="s3" src="raggi(1).mp3"></audio></td>
</tr>

<tr>
<td>LINEA A ZIG ZAG</td>
<td><button onclick="suona('s4')">♪</button><audio id="s4" src="linea frastagliata(2).mp3"></audio></td>
</tr>

<tr>
<td>LINEA ONDULATA</td>
<td><button onclick="suona('s5')">♪</button><audio id="s5" src="linea ondulata(2).mp3"></audio></td>
</tr>

<tr>
<td>LINEA SPEZZATA</td>
<td><button onclick="suona('s6')">♪</button><audio id="s6" src="linea spezzata(2).mp3"></audio></td>
</tr>

<tr>
<td>LINEA AGGROVIGLIATA</td>
<td><button onclick="suona('s7')">♪</button><audio id="s7" src="linea aggrovigliata(2).mp3"></audio></td>
</tr>

<tr>
<td>LINEA A SPIRALE</td>
<td><button onclick="suona('s8')">♪</button><audio id="s8" src="linea a spirale(2).mp3"></audio></td>
</tr>

</table>

<script>
function suona(id){
  const audio = document.getElementById(id);
  audio.currentTime = 0;
  audio.play();
}
</script>

</body>
</html>
